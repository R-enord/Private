[project]
name = "ai-intelligence-hub"
version = "0.1.0"
description = "Local-first, zero-cost AI intelligence and discovery hub"
requires-python = ">=3.11"
license = { text = "Proprietary (owner's private project)" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "nh3>=0.2.17",
  "markdown-it-py>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
hub = "hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits real external APIs (skipped unless HUB_LIVE_TESTS=1)",
]
filterwarnings = ["ignore::DeprecationWarning:feedparser.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]
